[binaries]
c = ['gcc', '--sysroot=/mnt/j86-sysroot', '-B/mnt/j86-sysroot/usr/lib/']
pkg-config = '/usr/bin/pkg-config'
wayland-scanner = '/usr/bin/wayland-scanner'
[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'
[properties]
sys_root = '/mnt/j86-sysroot'
pkg_config_libdir = ['/mnt/j86-sysroot/usr/lib/pkgconfig', '/mnt/j86-sysroot/usr/share/pkgconfig']
needs_exe_wrapper = true
[built-in options]
c_link_args = ['-Wl,-rpath-link,/mnt/j86-sysroot/usr/lib']
