context.properties = {
 core.daemon = true
 core.name = pipewire-0
 default.clock.rate = 48000
 default.clock.allowed-rates = [ 48000 ]
 default.clock.quantum = 1024
 default.clock.min-quantum = 1024
 default.clock.max-quantum = 1024
}
context.spa-libs = {
 audio.convert.* = audioconvert/libspa-audioconvert
 audio.adapt = audioconvert/libspa-audioconvert
 api.alsa.* = alsa/libspa-alsa
 support.* = support/libspa-support
}
context.modules = [
 { name = libpipewire-module-protocol-native }
 { name = libpipewire-module-metadata }
 { name = libpipewire-module-spa-node-factory }
 { name = libpipewire-module-client-node }
 { name = libpipewire-module-access args = { access.force = unrestricted } }
 { name = libpipewire-module-adapter }
 { name = libpipewire-module-link-factory }
]
context.objects = [
 { factory = spa-node-factory args = { factory.name = support.node.driver node.name = Dummy-Driver node.group = pipewire.dummy priority.driver = 20000 } }
 { factory = adapter args = {
  factory.name = api.alsa.pcm.sink
  node.name = j86-speakers
  node.description = "J86 Speakers isolated test"
  media.class = Audio/Sink
  api.alsa.path = j86
  api.alsa.period-size = 1024
  api.alsa.period-num = 4
  api.alsa.headroom = 0
  audio.format = S16LE
  audio.rate = 48000
  audio.channels = 2
  audio.position = [ FL FR ]
  node.pause-on-idle = true
  node.suspend-on-idle = true
  adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
 } }
]
