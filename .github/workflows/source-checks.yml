name: Source checks
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q .
      - run: python apps/tests/relay-duplex.py
      - run: python apps/tests/client-disconnect.py
      - run: python touch/tests/start-profile.py
      - run: python wifi/tests/prepare-ram-firmware.py
      - run: python apps/tests/root-readonly.py
      - run: python wifi/tests/calibration.py
      - run: python sensors/tests/oscar-packet.py
      - run: python tests/network-deadline.py
      - run: python desktop/tests/session-keys.py
      - run: python sensors/tests/rotation-policy.py
      - run: python sensors/tests/iio-source.py
      - run: python wifi/tests/stage-driver-firmware.py
      - run: python power/tests/preflight.py
      - run: cc -std=c11 -Wall -Wextra -Werror audio/mca/tests/plan.c -o /tmp/j86-mca-plan && /tmp/j86-mca-plan
      - run: python sensors/tests/oscar-receive.py
      - run: python sensors/tests/oscar-c-parser.py
      - run: python wifi/tests/driver-bind-plan.py
      - run: python apps/tests/transaction-timeout.py
      - run: python apps/tests/installer-gate.py
      - run: python tests/boot-profile.py
      - run: python updates/tests/update.py
      - run: python tests/usb-readiness.py
      - run: python desktop/tests/browser-start.py
      - run: cc -std=c11 -Wall -Wextra -Werror audio/switch/tests/plan.c -o /tmp/j86-switch-plan && /tmp/j86-switch-plan
      - run: cc -std=c11 -Wall -Wextra -Werror audio/nco/tests/plan.c -o /tmp/j86-nco-plan && /tmp/j86-nco-plan
